# =====================================================================
#  Fichier de projet : une vidéo = un fichier .ini
#  Lancer :  python3 creer_video.py chevre_ia.ini
#  Résultat : output/<nom>.mp4
#  Les chemins sont relatifs à l'emplacement de ce fichier.
# =====================================================================

[video]
# nom du fichier produit (output/<nom>.mp4)
nom = chevre_ia

# texte : un paragraphe (ou une réplique) par ligne ; lignes vides ignorées
dialogue = dialogue.txt

# enregistrement de la voix ; laisser vide pour une vidéo muette au minutage estimé
audio = conversation.mp3

# duo : deux personnages qui dialoguent (lignes « Person_1 : ... » / « Person_2 : ... »)
# solo : une seule personne présente ; toutes les lignes lui sont attribuées
mode = solo

# (solo) Person_1 (pull jaune, lunettes), Person_2 (pull violet) ou Chevre
presentateur = Chevre
# (solo) côté du présentateur : gauche ou droite
position = gauche

# illustrations animées du panneau blanc (modules du dossier capsule/scenes/) :
#   donnees_ia -> écrites pour le texte actuel de dialogue.txt (« Avec quoi nourrit-on les IA ? »)
#   aucune     -> panneau vide (pour un autre texte : y mettre ses propres images / vidéos)
illustrations = donnees_ia
# titre affiché au début et à la fin, seulement avec « illustrations = aucune »
titre =

# sous-titres incrustés dans l'image : oui / non
sous_titres = non
# fichier de sous-titres séparé output/<nom>.srt : oui / non
fichier_srt = non
# normaliser le volume de la voix : oui / non
normaliser_audio = oui


# =====================================================================
#  Images et vidéos insérées dans le panneau blanc
#  Une section par média, nommée [media ...] (n'importe quel suffixe).
#  Formats : images png, jpg, webp… ; vidéos mp4, mov, webm, gif… (le son des vidéos est ignoré)
#
#  fichier              = chemin de l'image ou de la vidéo
#  paragraphe           = numéro du paragraphe pendant lequel elle apparaît (1 = première ligne non vide)
#  a_partir_de          = (facultatif) mot ou expression du paragraphe à partir duquel elle apparaît
#  duree                = (facultatif) durée d'affichage en secondes ; par défaut jusqu'à la fin du paragraphe
#  debut                = à la place de « paragraphe » : instant d'apparition en secondes dans la vidéo
#  zone                 = panneau (tout l'espace blanc), haut, bas, gauche ou droite
#  masquer_illustration = oui : l'illustration animée est cachée pendant l'affichage ; non : superposée
#  legende              = (facultatif) texte affiché sous le média
#  boucle               = (vidéos) oui : rejoue en boucle ; non : reste sur la dernière image
#
#  Exemple (retirer les « # » pour l'activer) :
# [media affiche]
# fichier = medias/ex_machina.jpg
# paragraphe = 1
# a_partir_de = Ex Makina
# duree = 6
# legende = Ex Machina (Alex Garland, 2014)
# =====================================================================
